<!doctype html><meta charset="utf-8"><title>上傳要求對照測試</title><label>測試上傳碼 <input id="code" type="password"></label><button id="send">傳送測試要求</button><pre id="result">尚未測試</pre><script>
const pending=new Map();
window.addEventListener('message',e=>{const r=e.data;if(!r||!pending.has(r.id))return;document.getElementById('result').textContent+='\n回覆：'+e.origin+' '+r.method+' '+r.ok+' '+(r.error||'準備完成');pending.delete(r.id);});
document.getElementById('send').onclick=()=>{
 const id=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');
 const frame=document.createElement('iframe');frame.name='probe_'+id;
 const form=document.createElement('form');form.method='POST';form.action="https://script.google.com/macros/s/AKfycbyAxiBEgnO4CA3r-9fc5OuXLXgoSmRq0lcrlsmw4HPhD3jWuTefanXBGoJmWt5H60ZY/exec";form.target=frame.name;form.acceptCharset='UTF-8';
 const input=document.createElement('input');input.type='hidden';input.name='payload';input.value=JSON.stringify({id,method:'prepareUpload',args:[document.getElementById('code').value,{name:'second-photo.png',mime:'image/png',size:68,uploadKey:id,prefixSha256:'invalid'},"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII="]});form.append(input);
 pending.set(id,true);document.body.append(frame,form);form.submit();document.getElementById('result').textContent='已送出：'+id;
};</script>
